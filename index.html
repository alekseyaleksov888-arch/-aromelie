<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aromelie.lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;600&family=Quicksand:wght@700&display=swap">
<style>
:root{--bg:#1a1613;--card:#251f1b;--card2:#2e2721;--gold:#d9b46f;--tx:#f2e9dc;--mu:#9c8f80;--ok:#2f3a2f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="light"]){--bg:#1a1613}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 Manrope,system-ui,sans-serif}
body{padding:16px 14px 90px}
h1{font:600 34px/1.1 "Cormorant Garamond",Georgia,serif;margin:6px 0 4px;letter-spacing:.04em}
.sub{color:var(--mu);margin:0 0 12px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.bag{position:relative;border:0;background:var(--card);color:var(--gold);width:46px;height:46px;border-radius:50%;font-size:20px}
.bag b{position:absolute;top:-4px;right:-4px;background:var(--gold);color:#1a1613;border-radius:10px;font-size:12px;padding:1px 6px}
.gift{background:var(--ok);border-radius:14px;padding:11px 14px;margin:6px 0 12px}
input.s{width:100%;background:var(--card);border:1px solid transparent;color:var(--tx);border-radius:14px;padding:13px 14px;font:inherit;margin-bottom:14px}
input.s:focus,button:focus-visible{outline:2px solid var(--gold)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.c{background:var(--card);border-radius:18px;padding:12px;text-align:left;border:0;color:inherit;font:inherit;display:flex;flex-direction:column;gap:4px}
.m{height:120px;border-radius:12px;background:linear-gradient(145deg,#3a2f25,#1f1914);display:grid;place-items:center;font:600 40px "Cormorant Garamond",serif;color:var(--gold);margin-bottom:6px}
.m.w{position:relative;display:block;background:#18171c;padding:0;height:150px;overflow:hidden}.m.w img{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);object-fit:contain;object-position:center}.m.wh{background:#fff}.m.big{height:260px;margin-bottom:12px}.br{color:var(--mu);font-size:12px;letter-spacing:.06em}
.nm{font-weight:600;min-height:2.6em}
.pr{color:var(--gold);margin-top:2px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:5}
.ov.on{display:flex}
.sh{background:var(--card);width:100%;max-height:92%;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sh h2{font:600 28px/1.1 "Cormorant Garamond",serif;margin:0 0 2px}
.vs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.v{background:var(--card2);border:1px solid transparent;color:var(--tx);border-radius:14px;padding:10px 4px;font:inherit}
.v small{display:block;color:var(--mu)}
.v.on{border-color:var(--gold)}
.nt{background:var(--card2);border-radius:14px;padding:12px;color:var(--mu);margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center}
.q{display:flex;align-items:center;gap:12px;background:var(--card2);border-radius:14px;padding:4px 8px}
.q button{background:none;border:0;color:var(--tx);font-size:22px;width:32px;height:38px}
.go{flex:1;background:var(--gold);color:#1a1613;border:0;border-radius:14px;padding:14px;font:600 16px Manrope,sans-serif}
.it{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--card2)}
.it button{background:none;border:0;color:var(--mu);font-size:13px}
.tot{display:flex;justify-content:space-between;font-weight:600;font-size:18px;margin:14px 0}
.dl{position:relative;margin:14px 0 0;padding:10px 12px 18px;background:var(--ok);border-radius:12px;font-size:14px}.dl::after{content:"";position:absolute;left:12px;right:12px;bottom:8px;height:3px;border-radius:2px;background:rgba(255,255,255,.14)}.dl i{position:absolute;left:12px;bottom:8px;height:3px;border-radius:2px;background:var(--gold);z-index:1;transition:width .3s}.of{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 14px;padding:12px 14px;background:var(--card);border-left:3px solid var(--gold);border-radius:12px;font-size:14px}.of button{flex:none;background:none;border:1px solid var(--gold);color:var(--gold);border-radius:12px;padding:9px 14px;font:600 14px Manrope,sans-serif}.sel{width:100%;background:var(--card2);color:var(--tx);border:0;border-radius:14px;padding:14px;font:inherit;margin:6px 0 14px}.bt{width:100%;margin-top:10px;background:none;border:1px solid var(--gold);color:var(--gold);border-radius:14px;padding:13px;font:600 15px Manrope,sans-serif}.x{background:none;border:0;color:var(--mu);float:right;font-size:26px}
#sp{position:fixed;inset:0;z-index:50;overflow:hidden;background:radial-gradient(ellipse at 50% 38%,#14382f 0%,#0b2028 55%,#060b16 100%);transition:opacity 1s ease}#sp.out{opacity:0;pointer-events:none}#sv,#sn{position:absolute;inset:0;width:100%;height:100%}.lg{position:absolute;left:0;right:0;top:44%;transform:translateY(-50%);text-align:center}.tt{font:700 clamp(25px,8.2vw,40px)/1 Quicksand,system-ui,sans-serif;letter-spacing:.2em;padding-left:.2em;filter:drop-shadow(0 0 10px rgba(255,214,130,.35))}.tt .l{display:inline-block;position:relative;opacity:0;transform:translateY(10px) scale(.88);background:linear-gradient(180deg,#fff3cf,#e2bd78 55%,#b98d4a);-webkit-background-clip:text;background-clip:text;color:transparent;animation:li .7s cubic-bezier(.2,.8,.2,1) forwards}.tt .o::before{content:"";position:absolute;top:-.3em;left:50%;width:.2em;height:.15em;border-radius:.05em;transform:translateX(-50%);background:#f0d391}@keyframes li{to{opacity:1;transform:none}}.ul{height:1px;width:0;margin:18px auto 0;background:linear-gradient(90deg,transparent,#e2bd78,transparent);box-shadow:0 0 12px rgba(226,189,120,.7);animation:ul 1.2s ease 2.3s forwards}@keyframes ul{to{width:68%}}.tg{margin:16px 0 0;color:#d9c79a;font:600 13px Manrope,sans-serif;letter-spacing:.18em;text-transform:uppercase;opacity:0;animation:fi 1s ease 3s forwards}@keyframes fi{to{opacity:.9}}.tw{animation:tw 1.8s ease-in-out infinite alternate}@keyframes tw{from{opacity:.25}to{opacity:1}}@media (prefers-reduced-motion:reduce){#sp{display:none}}</style></head><body>
<div id="sp"><svg id="sv" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice"></svg><canvas id="sn"></canvas><div class="lg"><div class="tt" id="tt" aria-label="Aromelie.lab"></div><div class="ul"></div><p class="tg">парфюмерия со смыслом</p></div></div>
<div class="top"><div><h1>Aromelie.lab</h1><p class="sub">парфюмерия со смыслом</p></div><button class="bag" id="bag" aria-label="Корзина">🛍<b id="cnt" hidden>0</b></button></div>
<div class="gift"><b>Атомайзер</b> входит в стоимость распива</div>
<div class="gift" style="margin-top:-4px"><b>Доставка</b> от 3 000 ₽ по Ростову бесплатная</div>
<div class="of"><span>Вы можете приобрести под заказ любой полноразмерный флакон парфюма.</span><button onclick="bottleAny()">Заказать</button></div>
<input class="s" id="q" placeholder="Аромат, бренд или нота" autocomplete="off">
<div class="grid" id="grid"></div>
<div class="ov" id="ov"><div class="sh" id="sh"></div></div>
<script>
let C=[],IMG={},BG={};
const VOLS=[3,5,10,15,20,30];
const rub=n=>n.toLocaleString("ru-RU")+" ₽";
let cart=[],cur=null,vol=5,qty=1;
const $=id=>document.getElementById(id);
const tg=window.Telegram&&window.Telegram.WebApp;if(tg){tg.ready();tg.expand()}
function draw(){const s=$("q").value.trim().toLowerCase();
$("grid").innerHTML=C.map((x,i)=>({x,i})).filter(o=>(o.x.b+" "+o.x.n+" "+o.x.t).toLowerCase().includes(s)).map(o=>`<button class="c" onclick="openC(${o.i})">${IMG[o.x.n]?`<div class="m w" style="background:${BG[o.x.n]}"><img src="${IMG[o.x.n]}" alt="${o.x.n}"></div>`:`<div class="m">${o.x.n[0]}</div>`}<span class="br">${o.x.b}</span><span class="nm">${o.x.n}</span><span class="pr">от ${rub(o.x.p*3)}</span></button>`).join("")||"<p class='sub'>Ничего не найдено. Попробуйте другое название или ноту.</p>"}
function show(h){$("sh").innerHTML=h;$("ov").classList.add("on")}
function hide(){$("ov").classList.remove("on")}
function openC(i){cur=i;vol=5;qty=1;card()}
function card(){const x=C[cur];
show(`<button class="x" onclick="hide()" aria-label="Закрыть">×</button>${IMG[x.n]?`<div class="m w big" style="background:${BG[x.n]}"><img src="${IMG[x.n]}" alt="${x.n}"></div>`:""}<span class="br">${x.b}</span><h2>${x.n}</h2><p class="sub">Распив · ${x.p} ₽ за мл. Атомайзер входит в стоимость распива.</p>
<div class="vs">${VOLS.map(v=>`<button class="v ${v==vol?"on":""}" onclick="vol=${v};card()"><b>${v} мл</b><small>${rub(v*x.p)}</small></button>`).join("")}</div>
<div class="nt">${x.t?(x.t.startsWith("верх")?x.t.split("; ").map(s=>"<b>"+s.replace(":",":</b>")).join("<br>"):"Ноты: "+x.t):"Описание и ноты скоро появятся"}</div>
<div class="row"><div class="q"><button onclick="qty=Math.max(1,qty-1);card()">−</button><b>${qty}</b><button onclick="qty++;card()">+</button></div><button class="go" onclick="add()">Добавить · ${rub(vol*x.p*qty)}</button></div><button class="bt" onclick="bottle()">Заказать полноразмерный флакон</button>`)}
function add(){const f=cart.find(c=>c.i==cur&&c.v==vol);f?f.q+=qty:cart.push({i:cur,v:vol,q:qty});upd();hide()}
function upd(){const n=cart.reduce((a,c)=>a+c.q,0);$("cnt").textContent=n;$("cnt").hidden=!n}
const sum=()=>cart.reduce((a,c)=>a+c.v*C[c.i].p*c.q,0);
function openCart(){if(!cart.length){show(`<button class="x" onclick="hide()">×</button><h2>Корзина пуста</h2><p class="sub">Выберите аромат и объём в каталоге.</p>`);return}
show(`<button class="x" onclick="hide()">×</button><h2>Корзина</h2>`+cart.map((c,k)=>`<div class="it"><div><b>${C[c.i].n}</b><br><span class="sub">${C[c.i].b} · ${c.v} мл × ${c.q}</span></div><div>${rub(c.v*C[c.i].p*c.q)}<br><button onclick="cart.splice(${k},1);upd();openCart()">Убрать</button></div></div>`).join("")+`<div class="dl">${sum()>=3000?"Доставка по Ростову бесплатная":"До бесплатной доставки по Ростову осталось "+rub(3000-sum())}<i style="width:calc((100% - 24px) * ${Math.min(1,sum()/3000)})"></i></div><div class="tot"><span>Итого</span><span>${rub(sum())}</span></div><button class="go" style="width:100%" onclick="order()">Оформить заказ</button>`)}
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function bottleAny(){show(`<button class="x" onclick="hide()" aria-label="Закрыть">×</button><h2>Полноразмерный флакон</h2><p class="sub">Выберите аромат из каталога или впишите название вручную. Цену и срок назовём после заявки.</p><select id="bs" class="sel"><option value="">Выбрать из каталога</option>${C.map((x,i)=>`<option value="${i}">${x.b} · ${x.n}</option>`).join("")}</select><input id="bm" class="sel" maxlength="100" placeholder="Или впишите название вручную" autocomplete="off"><p class="sub" id="be" style="color:#e58a8a;margin:0 0 10px"></p><button class="go" style="width:100%" onclick="sendB()">Отправить заявку</button>`)}
function sendB(){const t=$("bm").value.trim(),i=$("bs").value;if(!t&&i===""){$("be").textContent="Выберите аромат или впишите название";return}
const x=t?{b:"",n:t}:C[+i],d={type:"bottle",brand:x.b,name:x.n};if(tg){tg.sendData(JSON.stringify(d))}else{show(`<h2>Заявка на флакон</h2><p class="sub">${esc((x.b+" "+x.n).trim())}. В Telegram заявка уйдёт вам в личные сообщения. В предпросмотре она никуда не отправляется.</p><button class="go" style="width:100%" onclick="hide()">Понятно</button>`)}}
function bottle(){const x=C[cur],d={type:"bottle",brand:x.b,name:x.n};if(tg){tg.sendData(JSON.stringify(d))}else{show(`<h2>Заявка на флакон</h2><p class="sub">${x.b} ${x.n}. В Telegram заявка уйдёт вам в личные сообщения, и вы назовёте цену и срок. В предпросмотре она никуда не отправляется.</p><button class="go" style="width:100%" onclick="hide()">Понятно</button>`)}}
function order(){const d={items:cart.map(c=>({brand:C[c.i].b,name:C[c.i].n,ml:c.v,qty:c.q,price:c.v*C[c.i].p*c.q})),total:sum()};
if(tg){tg.sendData(JSON.stringify(d))}else{show(`<h2>Спасибо за заказ!🙌🏻</h2><p>Предоплата за заказ 100%💲</p><p>Напишите ваш контактный номер телефона для связи 📞</p><p class="sub" style="font-size:12px">Это предпросмотр: заказ никуда не отправляется. В Telegram заказ придёт вам, а клиент получит это сообщение от бота.</p><button class="go" style="width:100%" onclick="cart=[];upd();hide()">Понятно</button>`)}}
$("q").oninput=draw;$("bag").onclick=openCart;function load(){fetch("catalog.json?v="+Date.now()).then(r=>r.json()).then(j=>{C=[];j.forEach(x=>{if(x.stock===false)return;C.push({b:x.brand,n:x.name,p:x.price,t:x.notes||""});if(x.photo){IMG[x.name]=x.photo;BG[x.name]=x.bg||"#18171c"}});draw()}).catch(()=>{$("grid").innerHTML="<p class='sub'>Не удалось загрузить каталог. Попробуйте позже.</p>"})}
$("ov").onclick=e=>{if(e.target.id=="ov")hide()};load();
(function(){const sp=$("sp");if(!sp)return;if(matchMedia("(prefers-reduced-motion:reduce)").matches){sp.remove();return}
const NS="http://www.w3.org/2000/svg",svg=$("sv"),PAL=["#ffd36e","#ff5a5a","#ffffff","#7be0a6","#ff9d3d"];
const el=(n,a)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e};
function tree(cx,b,h,w,c){for(let i=0;i<3;i++){const t=b-h*i*.3,hh=h*.5,ww=w*(1-i*.22);el("polygon",{points:cx+","+(t-hh)+" "+(cx-ww/2)+","+t+" "+(cx+ww/2)+","+t,fill:c});for(let k=0;k<7;k++){const y=t-hh*Math.random(),wd=ww*(y-(t-hh))/hh,x=cx+(Math.random()-.5)*wd*.8,col=PAL[(Math.random()*5)|0];const d=el("circle",{cx:x,cy:y,r:2.3,fill:col,class:"tw"});d.style.color=col;d.style.filter="drop-shadow(0 0 3px "+col+")";d.style.animationDelay=(Math.random()*1.8)+"s"}}el("rect",{x:cx-w*.04,y:b,width:w*.08,height:16,fill:"#2a1a12"})}
tree(55,830,310,150,"#0b3226");tree(350,835,340,170,"#0a2d23");tree(205,850,190,115,"#12503c");
function garland(p0,p1,p2,n){el("path",{d:"M"+p0+" Q"+p1+" "+p2,fill:"none",stroke:"#1d3d31","stroke-width":1.6});for(let i=1;i<n;i++){const t=i/n,u=1-t,x=u*u*p0[0]+2*u*t*p1[0]+t*t*p2[0],y=u*u*p0[1]+2*u*t*p1[1]+t*t*p2[1],col=PAL[(i*3+n)%5];const b=el("circle",{cx:x,cy:y+4,r:3.4,fill:col,class:"tw"});b.style.color=col;b.style.filter="drop-shadow(0 0 4px "+col+")";b.style.animationDelay=(i*.23)+"s"}}
garland([-10,18],[100,115],[200,28],9);garland([200,28],[300,115],[410,18],9);garland([-10,78],[100,175],[200,88],9);garland([200,88],[300,175],[410,78],9);
const tt=$("tt");"AROMELIE.LAB".split("").forEach((c,i)=>{const s=document.createElement("span");s.className="l"+(c=="O"?" o":"");s.textContent=c;s.style.animationDelay=(.6+i*.12)+"s";tt.appendChild(s)});
const cv=$("sn"),cx=cv.getContext("2d");let W,H,R=window.devicePixelRatio||1,raf;function rs(){W=cv.clientWidth;H=cv.clientHeight;cv.width=W*R;cv.height=H*R;cx.setTransform(R,0,0,R,0,0)}rs();addEventListener("resize",rs);
const F=Array.from({length:90},()=>({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*2.6,v:.5+Math.random()*1.1,p:Math.random()*6.3,a:.45+Math.random()*.5}));
function fr(){cx.clearRect(0,0,W,H);for(const f of F){f.y+=f.v;f.p+=.015;f.x+=Math.sin(f.p)*.4;if(f.y>H+5){f.y=-5;f.x=Math.random()*W}cx.beginPath();cx.fillStyle="rgba(255,255,255,"+f.a+")";cx.arc(f.x,f.y,f.r,0,6.3);cx.fill()}raf=requestAnimationFrame(fr)}fr();
let done=0;function end(){if(done)return;done=1;sp.classList.add("out");setTimeout(()=>{cancelAnimationFrame(raf);sp.remove()},1000)}
sp.onclick=end;setTimeout(end,5600)})();
</script></body></html>
